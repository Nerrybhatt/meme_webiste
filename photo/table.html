<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
    tr{
        border-bottom: 5px solid green;
    }
    td{
        text-align: center;
        width:20px;
    }
    tr:nth-child(odd){
        background-color: red;
    }
    tr:nth-child(even){
        background-color:yellow;
  }
  table{
    table-layout: fixed;
    border-collapse: collapse;
    width:100%;
  }
  
  


    </style>
</head>
<body>
    <table >
        <tr>
            <td>Serial Number</td>
            <td>Name of the students</td>
        </tr>
        <tr>
            <td>1</td>
            <td>Ram</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Shyam</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Hari</td>
        </tr>
    </table>
    
</body>
</html>
