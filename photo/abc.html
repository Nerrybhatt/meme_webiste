<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Facebook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1877f2;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #1877f2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .link:hover {
            background: #1256a2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>About Facebook</h1>
        <p>Facebook is a social media platform founded by Mark Zuckerberg in 2004. It allows users to connect, share updates, and communicate with friends and family.</p>
        <a class="link" href="https://www.facebook.com" target="_blank">Visit Facebook</a>
    </div>
</body>
</html>
